[project]
name = "interview-rag"
version = "0.1.0"
description = "熟練者インタビューから知識を抽出し、Vector RAGで活用するMVP"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "faiss-cpu>=1.12.0",
  "numpy>=1.26",
  "ollama>=0.6.0",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "typer>=0.16",
]

[project.scripts]
interview-rag = "interview_rag.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_rag"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a running Ollama server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]
